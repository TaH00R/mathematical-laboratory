<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Lab : 50 Mathematical Experiments</title>
    <link rel="stylesheet" href="style.css"><link rel="stylesheet" href="shared.css">
</head>
<body class="home-page">

    <header class="hero">
        <div class="eyebrow">MATHEMATICAL PLAYGROUND</div>

        <h1>
            MATH<span>//</span>LAB
        </h1>

        <p class="subtitle">Explore the patterns behind numbers, shapes and change.</p>

        <div class="hero-meta">
            <span><b id="experimentCount">50</b> experiments</span>


        </div>
    </header>

    <main>
        <section class="section-head">
            <div>

                <h2>Explore</h2>
            </div>

            <div class="filters" id="filters">
                <button class="filter active" aria-pressed="true" data-category="all">all</button>
                <button class="filter" aria-pressed="false" data-category="number-theory">number theory</button>
                <button class="filter" aria-pressed="false" data-category="fractals">fractals</button>
                <button class="filter" aria-pressed="false" data-category="probability">probability</button>
                <button class="filter" aria-pressed="false" data-category="geometry">geometry</button>
                <button class="filter" aria-pressed="false" data-category="calculus">calculus</button>
            </div>
        </section>

        <label class="search-label" for="search">Find an experiment</label><input id="search" type="search" placeholder="Search experiments"><p id="results" aria-live="polite"></p>
        <section class="grid" id="experimentGrid"></section>
    </main>

    <footer>
        <span>MATH // LAB</span>
        <span>built one experiment at a time.</span>
    </footer>

    <script src="experiments.js"></script><script src="script.js"></script>
</body>
</html>
